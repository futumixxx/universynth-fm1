name: Build UNIVERSYNTH .fwsc

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build deps
        run: pip3 install Pillow

      - name: Install the JieLi Linux toolchain (clang for pi32v2)
        run: |
          sh tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"

      - name: Fetch the JieLi AC79 SDK (Apache-2.0, public)
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Build the firmware and the .fwsc package
        run: |
          VER="$(date +%Y.%m.%d)-universynth"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh --release "$VER"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universynth-fwsc
          path: |
            build/*.fwsc
            build/release-*/**
          if-no-files-found: error

      - name: Publish a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.fwsc
            build/release-*/SHA256SUMS
